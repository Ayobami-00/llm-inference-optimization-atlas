summary: Combine the nine open Dependabot updates into one coherent Python and frontend maintenance change. Upgrade React and ReactDOM atomically with their type packages, refresh the remaining compatible development and runtime dependencies, and validate the resolved dependency graph before merging.
motivation: The current Dependabot queue contains overlapping Python and npm lockfile updates. React and ReactDOM were proposed separately and each isolated branch fails frontend validation because it creates a mixed 19.1/19.2 runtime pair; one coordinated change can test the actual final dependency graph and avoid merge-conflict churn.
scope:
  subsystem: dependency_toolchain
  breaking_change: false
  migration: No canonical schemas, accepted evidence, model runtimes, or public Atlas interfaces change. React and ReactDOM move together to 19.2.8; supporting type, test, graph, CLI, lint, and property-test packages move to the versions already proposed by Dependabot. The deprecated @types/cytoscape stub is removed because Cytoscape 3.34 supplies its own declarations.
  acceptance_tests:
    - Python formatting, linting, static typing, tests, strict artifact validation, and deterministic graph compilation pass.
    - Frontend type checking, component tests, production build, Playwright flows, and accessibility checks pass.
    - React, ReactDOM, and their type packages resolve as a compatible set.
    - Cytoscape type checking uses the declarations bundled with Cytoscape rather than the deprecated stub package.
    - Lock and production dependency audits pass.
    - Accepted study evidence and pinned model/runtime records remain unchanged.
