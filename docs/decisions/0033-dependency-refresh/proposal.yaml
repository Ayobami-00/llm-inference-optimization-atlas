resources:
  implementation: Existing repository tooling, package registries, Dependabot branches, and CI
  compute: Existing validation and browser fixtures; no model downloads or study reruns
risks:
  - A coordinated React runtime update may expose rendering or interaction regressions; require component and browser coverage.
  - Cytoscape's bundled types may expose API assumptions formerly hidden by DefinitelyTyped; require TypeScript and graph interaction checks.
  - A newer Node type surface may conflict with the configured browser toolchain; retain it only if the complete frontend checks pass.
  - Shared lockfile regeneration may introduce unrelated transitive drift; inspect the final diff and audit result.
