  - dependency_locks
  - tests
  - documentation
resources:
  implementation: Existing repository tooling, package registries, and CI
  compute: Existing validation and browser fixtures; no model downloads
risks:
  - Coupled major upgrades may expose type, build, or browser regressions; require complete local and hosted checks.
  - Updating Transformers would desynchronize accepted runtime records; exclude that update until a new runtime revision and real-model reproduction are approved.
  - A relaxed media-path assertion could hide deployment errors; retain the exact GitHub Pages path assertion in Playwright.
