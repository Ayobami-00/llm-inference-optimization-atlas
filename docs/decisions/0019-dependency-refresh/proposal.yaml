summary: Combine the compatible Dependabot updates into one coherent Python, frontend, and GitHub Actions maintenance change. Upgrade coupled frontend majors together, retain the accepted-study Transformers 4 runtime boundary, and verify the entire repository and browser experience before merging.
motivation: The initial Dependabot queue contains several updates that modify the same lockfiles, so merging them independently creates repeated conflicts and CI churn. Vite 8 also requires a matching React plugin major, while Vitest 4 changes how the unit-test environment represents the configured base URL. A coordinated update can test the actual final dependency graph and preserve evidence reproducibility.
scope:
  subsystem: dependency_toolchain
  breaking_change: false
  migration: Development and data-processing dependencies move to their tested current majors. Accepted study execution remains pinned to Transformers 4.57.6 in registry and execution records; Transformers 5 is explicitly deferred to a separately validated runtime revision.
  acceptance_tests:
    - Python formatting, linting, static typing, tests, strict artifact validation, and graph compilation pass.
    - Frontend type checking, component tests, production build, Playwright flows, and accessibility checks pass.
    - Vite and its React plugin use compatible majors.
    - The test harness verifies media paths without depending on Vitest's synthetic base URL.
    - Existing accepted evidence and runtime pins remain unchanged.
artifacts:
