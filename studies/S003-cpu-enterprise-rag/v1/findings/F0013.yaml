observation: Mean E2E latency changed from 2857.56 to 2756.98 ms; the paired absolute-effect interval was -264.28 to 85.64 ms, while every run passed Q1 and SLO003.
mechanism: Quantizing the compact embedding encoder reduces its representation cost, but SmolLM2 generation dominates this end-to-end pipeline and any embedding benefit was smaller than replicate variation.
