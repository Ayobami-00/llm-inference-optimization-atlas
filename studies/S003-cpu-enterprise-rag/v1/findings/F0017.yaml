    unit: ms
works_when: [A fresh container and worker are launched for each compact 12-request run and startup is included in client E2E latency.]
stops_working_when: [A persistent warmed container serves enough requests to amortize launch and model-load cost outside the measurement window.]
interactions: [Observed overhead depends on container lifecycle, image cache state, process startup, model loading, request count, and host Docker implementation.]
limitations: [This is a cold per-run container result on Docker Desktop for Apple M3; it must not be generalized to persistent Linux containers or steady-state orchestration overhead.]
