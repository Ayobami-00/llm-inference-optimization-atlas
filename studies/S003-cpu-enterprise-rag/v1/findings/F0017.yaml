observation: Mean E2E latency increased from 825.08 to 2928.73 ms; the paired absolute-effect interval was 1847.89 to 2345.17 ms, with all six runs passing Q1 and SLO003.
mechanism: The protocol starts a fresh container and Python/model process per run, attributes launch and model-load overhead to the first measured client request, and amortizes that cost over only 12 requests.
