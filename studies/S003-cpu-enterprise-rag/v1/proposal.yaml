  research_questions:
    - What latency, memory, and retrieval-quality tradeoff does INT8 embedding introduce?
    - How do top_k values 1, 3, and 5 affect grounding, answer quality, and latency?
    - When do precomputed embeddings outperform online embedding?
    - What overhead does the pinned Docker pipeline add relative to native host execution?
  included:
    - Approximately 24 repository-owned enterprise-style documents
    - Twelve grounded questions with expected citations
    - Retrieval recall, answer correctness, grounding, citation, and format evaluation
    - Multi-architecture Docker CPU pipeline
    - Quick and three-replicate full profiles
  excluded:
