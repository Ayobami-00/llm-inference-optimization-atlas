provenance:
  method: Pareto judgment over accepted S003 findings and quality/SLO-eligible comparisons
  source_paths: [studies/S003-cpu-enterprise-rag/v1/findings/F0013.yaml, studies/S003-cpu-enterprise-rag/v1/findings/F0014.yaml, studies/S003-cpu-enterprise-rag/v1/findings/F0015.yaml, studies/S003-cpu-enterprise-rag/v1/findings/F0016.yaml, studies/S003-cpu-enterprise-rag/v1/findings/F0017.yaml]
  generated: false
