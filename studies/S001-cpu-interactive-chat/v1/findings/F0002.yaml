observation: Mean SLO goodput fell from 0.7371 to 0.0792 requests/s; the paired absolute-effect interval was -0.693 to -0.618 requests/s and the candidate comparison was not SLO eligible.
mechanism: With sparse arrivals and serial CPU execution, waiting to form and service a larger batch adds latency without enough concurrent work to recover SLO-qualified throughput.
