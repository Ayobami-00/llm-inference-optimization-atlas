stops_working_when: [A higher-concurrency workload can keep batches full enough to amortize execution, which was not tested here.]
interactions: [The result interacts with arrival rate, batch formation policy, and the latency thresholds in SLO001.]
limitations: [This finding does not establish that batch size two is harmful under saturated or offline workloads.]
