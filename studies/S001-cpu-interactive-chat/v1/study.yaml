product_brief: >-
  A local interactive assistant serves short multi-turn conversations to one
  user on a modern laptop CPU. The study prioritizes fast first-token response,
  stable inter-token latency, deterministic correctness checks, and useful
  throughput without GPU or cloud infrastructure.
research_questions:
  - How much does warm steady state reduce startup and first-token latency?
  - Where do batch sizes 1, 2, and 4 trade latency for SLO goodput?
  - How do CPU thread budgets 1, 4, and 8 affect latency, throughput, and 
    thermal drift?
