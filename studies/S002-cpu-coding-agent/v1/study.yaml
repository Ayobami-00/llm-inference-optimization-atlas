product_brief: >-
  A local coding agent repeatedly extends a compact repository context, sends
  completion requests to a CPU-only llama.cpp service, and validates generated
  solutions with unit tests in a locked-down container. Interactive task
  latency, correctness, and safe reproducibility are the primary constraints.
research_questions:
  - What latency benefit does warm prefix reuse provide over cold evaluation?
  - How do CPU thread budgets 1, 4, and 8 affect token latency and task 
    completion?
  - When does a second server slot improve goodput without harmful queueing?
  - How does controlled 256, 512, and 1024-token context growth change 
    performance?
boundaries:
  included:
    - Six repository-owned code tasks
    - Repeated prefixes and incremental context
    - Unit-test-based Q1 evaluation
    - Ephemeral no-network non-root Docker execution sandbox
    - Quick and three-replicate full profiles
  excluded:
