  - Scheduler, dynamic batch ceiling, static memory fraction, and decode graph ceiling.
  - SGLang server initialization seed 20260910.
  - MXFP8 backend, greedy decoding, text-only model override, and one-token decode steps.
  - Trace generator, per-rate trace, seed, connection reuse, timeouts, and server/cache initialization policy within each paired block.
  - Shared pinned host-table layout between host-sync and host-prefetch.
