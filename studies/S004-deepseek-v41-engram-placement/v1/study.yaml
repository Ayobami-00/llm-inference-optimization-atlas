product_brief: A text-generation service running DeepSeek-V4.1 Flash on one 4x NVIDIA B200 node must select an Engram placement mode for interactive and long-context production traffic without trading away correctness or SLO-qualified capacity.
research_questions:
  - How much usable HBM and KV-token capacity does host-resident Engram recover relative to device-resident Engram?
  - How do synchronous host access and asynchronous prefetch affect TTFT, TPOT, output throughput, and host-device pressure across context and concurrency strata?
  - Which Engram mode maximizes SLO-qualified offered-load capacity for the preregistered long-context production mixture?
  - Do placement or prefetch change deterministic model outputs, failure behavior, or resolved runtime mode?
boundaries:
