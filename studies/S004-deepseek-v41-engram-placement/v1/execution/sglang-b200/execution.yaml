  network_during_run: loopback-only
timeouts: {prepare_seconds: 14400, run_seconds: 72000, cleanup_seconds: 180}
cleanup: {required: true, idempotent: true}
limitations:
  - The quick profile is portable and synthetic; only the full Linux x86_64 CUDA profile can produce accepted evidence.
  - The provider image exposes no immutable OCI digest, so RT004 pins the exact installed SGLang source files and complete package manifest instead.
  - Engram prefetch in the measured implementation is eligible only for single-row decode steps.
  - Shared-memory transparent huge pages remain disabled at the provider default; no host or kernel tuning is performed.
  - NVIDIA 0x4 SW_POWER_CAP incidence under a continuously observed 1000 W configured limit is reported rather than filtered; results may not transfer to another power envelope.
