quality_gate: Q0
falsification_conditions:
  - Exact greedy output-token agreement or any other Q0 dimension fails.
  - Host placement does not increase available KV-cache token capacity.
  - Host prefetch has no positive paired throughput effect over synchronous host access at concurrency 8 or greater.
  - Host prefetch neither improves SLO-qualified capacity by at least 15 percent nor enables an otherwise infeasible workload class.
