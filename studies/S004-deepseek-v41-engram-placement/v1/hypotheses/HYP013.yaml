title: Host prefetch recovers useful capacity after Engram offload
description: Host placement trades fixed Engram HBM residency for KV capacity,
  while asynchronous prefetch recovers enough transfer cost to improve
  long-context SLO-qualified capacity without changing greedy outputs.
