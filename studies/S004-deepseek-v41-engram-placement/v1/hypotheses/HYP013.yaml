$schema: https://ayobami-00.github.io/llm-inference-optimization-atlas/schemas/v1/optimizations/hypothesis.schema.json
observation: DeepSeek-V4.1 Engram tables consume fixed accelerator memory, but
  their deterministic addressing may permit transfer overlap from host memory.
statement: Relative to device placement, host placement increases available KV
  token capacity; relative to synchronous host access, asynchronous prefetch has
  a positive paired throughput effect at concurrency 8 or greater and can raise
  SLO-qualified capacity by at least 15 percent or enable an otherwise infeasible
  workload class, while preserving exact greedy output tokens.
intervention: Move the Engram tables from device memory to shared pinned host
  memory, then enable asynchronous Engram prefetch as a separate intervention.
expected_mechanism: Deterministic Engram indices allow the next lookup to be
  issued on a background CUDA stream, overlapping host-to-device transfer with
  intervening decoder computation while reclaimed HBM expands the KV cache.
