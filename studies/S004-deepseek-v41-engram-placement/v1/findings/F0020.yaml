statement: Device and host-prefetch placement both failed the preregistered mixed-workload SLO at the lowest tested 0.2 request/s rate, so their SLO-qualified capacity boundary is left-censored and no capacity improvement can be computed.
scope:
  workload: atlas://workload-spec/WS004@v1
