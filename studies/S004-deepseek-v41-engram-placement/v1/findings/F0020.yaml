works_when:
  - The preregistered 8K, 32K, and 128K Poisson mixture, latency limits, and minimum tested 0.2 request/s rate define the capacity endpoint.
stops_working_when:
  - A lower-rate search brackets a qualifying point or a product owner prospectively changes the SLO.
interactions:
  - The capacity boundary depends jointly on context-class weights, output length, arrival process, queueing, and every class-specific latency limit.
limitations:
  - The search cannot compare the preregistered 15% capacity threshold because neither mode produced a positive, bracketed capacity estimate.
  - Class-level p95 values at 0.2 request/s contain 9, 7, and 3 observations for 8K, 32K, and 128K respectively and are boundary diagnostics, not precise tail estimates.
  - One paired block cannot establish reproducibility on another initialization or host.
