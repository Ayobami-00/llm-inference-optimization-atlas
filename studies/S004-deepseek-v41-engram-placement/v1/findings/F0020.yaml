observation: 'At 0.2 request/s, the 8K class failed in both modes: device p95 TTFT/TPOT was 4,693.73/54.584 ms and host-prefetch was 4,896.76/56.154 ms, against 2,500/50 ms limits. The 32K and 128K classes passed and all classes had 100% request success, but the conjunctive point failed. MET099 is stored as the 0.0 sentinel for no qualifying tested rate and its relative effect is unavailable.'
mechanism: The tested rate grid did not bracket a passing lower boundary because the 8K class already violated both latency limits at the first point. This is a measurement-boundary result, not evidence of zero physical throughput.
