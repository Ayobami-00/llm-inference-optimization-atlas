works_when:
  - The source-defined text-only, PP1, non-DP-attention, CuTeDSL MXFP8 eligibility conditions hold and layer 14 uses a shared pinned host table.
stops_working_when:
  - Prefill or multi-row decode dominates execution because the tested revision bypasses the asynchronous path for those shapes.
  - The scheduler's eligible single-row decode frequency is too low to create measurable overlap at the workload level.
interactions:
  - Prefetch effectiveness interacts with dynamic-batch shape, context length, concurrency, scheduler behavior, and host-memory access.
limitations:
