observation: Host-sync and host-prefetch each reported 42,697,728 KV-token slots. Prefetch changed run-level mean TTFT by +2.25%, mean TPOT by +1.30%, and output throughput by -1.27%. Across nine unique-prefix context cells at concurrency 8 or greater, throughput was higher in four and lower in five, with a median effect of -0.29% and a range from -6.56% to +2.45%.
mechanism: The tested source creates a prefetch stream but uses it only for ordinary single-row decode steps; multi-row dynamic-batch decode and prefill use the normal path. Logs prove stream construction on all four ranks but do not count eligible activations, so the mixed end-to-end result cannot identify overlap effectiveness per decode shape.
