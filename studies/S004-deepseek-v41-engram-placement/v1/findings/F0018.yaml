works_when:
  - The exact source-fingerprinted SGLang build resolves both DeepSeek-V4.1 Flash Engram tables to shared pinned host memory on the tested 4xB200 host.
stops_working_when:
  - Host DRAM is insufficient for the roughly 195-202 GiB observed system-level increase or host-table registration fails.
  - A different allocator, memory fraction, model build, or runtime changes the conversion from released model HBM to KV-token capacity.
interactions:
  - The useful trade depends on whether KV capacity is actually binding and whether the product can tolerate the measured latency and throughput envelope.
limitations:
  - One paired block cannot estimate run-to-run variance or establish a general performance effect.
  - Reported KV slots are an allocator capacity value, not demonstrated SLO-qualified concurrent context capacity.
  - Host mappings used no huge pages and no host, NUMA, kernel, or memory-lock tuning was tested.
