  model: atlas://model/M006@v1
  runtime: atlas://runtime/RT004@v1
  hardware: atlas://hardware/HW002@v1
  traffic: [atlas://traffic/T001@v1, atlas://traffic/T002@v1, atlas://traffic/T004@v1]
observation: Reported model-weight residency fell from 119.043 to 72.201 GB per GPU and KV capacity increased by 30,856,448 tokens (260.6%; 3.606x). Run-level mean TTFT changed from 2,047.46 to 2,314.27 ms, mean TPOT from 25.228 to 27.623 ms/token, output throughput from 330.01 to 286.26 token/s, and mean system host memory from 107.12 to 308.92 GiB.
mechanism: Treatment-resolution logs show both Engram tables resolved to shared pinned host mappings, reducing fixed model-weight HBM residency and allowing the unchanged allocator policy to reserve a larger KV pool. The experiment did not collect a causal CPU, PCIe, or CUDA timeline and therefore does not assign the performance change to a specific low-level stall.
