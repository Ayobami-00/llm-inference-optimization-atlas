proposal_type: study
summary: Establish when DeepSeek-V4.1 Flash should keep Engram tables in HBM, move them to host RAM, or use host RAM with asynchronous prefetch on a 4x B200 SGLang deployment.
motivation: DeepSeek-V4.1 introduces a large Engram parameter table that can trade HBM residency for host-device traffic. Operators lack controlled, replicated evidence showing the net KV-capacity gain, performance cost, prefetch recovery, correctness boundary, and SLO-qualified serving capacity on Blackwell hardware.
scope:
  study_id: S004
  slug: deepseek-v41-engram-placement
  product_brief: A text-generation service running DeepSeek-V4.1 Flash on one 4x NVIDIA B200 node must select an Engram placement mode for interactive and long-context production traffic without trading away correctness or SLO-qualified capacity.
  archetype: atlas://workload/W004@v1
  traffic_regimes:
    - atlas://traffic/T001@v1
    - atlas://traffic/T002@v1
    - atlas://traffic/T004@v1
