    - atlas://model/M006@v1
  hardware:
    - atlas://hardware/HW002@v1
  runtimes:
    - atlas://runtime/RT004@v1
  research_questions:
    - How much usable HBM and KV-token capacity does host-resident Engram recover relative to device-resident Engram?
    - How do synchronous host access and asynchronous prefetch affect TTFT, TPOT, output throughput, and host-device pressure across context and concurrency strata?
    - Which Engram mode maximizes SLO-qualified offered-load capacity for the preregistered long-context production mixture?
    - Do placement or prefetch change deterministic model outputs, failure behavior, or resolved runtime mode?
  included:
    - DeepSeek-V4.1 Flash revision dba1be0a40aa45a94ad051997016db3960a90277
    - One privacy-safe 4x NVIDIA B200 PCIe/NVLink topology
    - One immutable SGLang build with TP4, EP4, PP1, and DP1
    - Device, synchronous-host, and host-prefetch Engram configurations
    - Controlled natural-language, code, and high-entropy prompt families
    - Context lengths from 1024 through 131072 tokens
    - Concurrency from 1 through 64 where preregistered
    - Open-loop Poisson capacity search and overload behavior
    - Five paired independently initialized full-profile replicates
    - Q0 exact greedy-output equivalence
  excluded:
    - Vision, tool calling, sampling, speculative decoding, DSpark, and disaggregation
    - Cross-node, cross-hardware, cross-runtime, or cross-model generalization
    - Host kernel, huge-page, or memory-lock tuning without separate approval
    - Confirmatory claims from the optional 256K feasibility probe
    - Model-quality claims beyond deterministic execution equivalence
  configurations:
    - device-resident Engram with host table and prefetch disabled
    - synchronous host-resident Engram with prefetch disabled
    - host-resident Engram with asynchronous KV prefetch enabled
