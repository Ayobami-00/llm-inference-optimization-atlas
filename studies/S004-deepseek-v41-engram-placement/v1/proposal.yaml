risks:
  - The active SGLang V4.1 implementation may change or lack immutable source metadata.
  - Host-resident Engram may require pinned-memory or memory-lock settings unavailable on the rented node.
  - Prefetch may silently fall back outside its CUDA, backend, or decode eligibility conditions.
  - Very long-context and high-concurrency cells may OOM; failures remain visible evidence.
  - Provider contention, throttling, telemetry gaps, or load-generator lag may invalidate attempts.
  - Five system replicates limit transferability and precision for small effects.
  - Model and source licensing must be verified before evidence publication.
