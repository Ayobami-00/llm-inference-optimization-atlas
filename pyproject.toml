[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "llm-inference-optimization-atlas"
version = "0.1.0"
description = "A schema-first empirical atlas of LLM inference optimization"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "LLM Inference Optimization Atlas contributors" }]
dependencies = [
  "jsonschema>=4.23,<5",
  "numpy>=2.1,<3",
  "psutil>=6.1,<8",
  "pyarrow>=18,<22",
  "referencing>=0.36,<1",
  "rich>=13.9,<15",
  "ruamel-yaml>=0.18,<1",
  "scipy>=1.14,<2",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
transformers = [
  "safetensors>=0.5,<1",
  "torch>=2.5,<3",
  "transformers>=4.48,<5",
]
onnx = [
  "onnxruntime>=1.20,<2",
  "sentence-transformers>=3.3,<6",
]

[dependency-groups]
dev = [
  "hypothesis>=6.120,<7",
  "mypy>=1.14,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23,<5",
  "types-psutil>=6.1,<8",
]

[project.scripts]
atlas = "atlas.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["atlas"]

[[tool.mypy.overrides]]
module = [
  "onnxruntime",
  "onnxruntime.*",
  "pyarrow",
  "pyarrow.*",
  "torch",
  "torch.*",
  "transformers",
  "transformers.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["atlas"]
branch = true
