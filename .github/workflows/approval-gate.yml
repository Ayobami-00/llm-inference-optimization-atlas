name: Approved contribution gate

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  approval:
    name: Match PR to approved proposal
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default branch only
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.31
      - name: Install approval checker
        run: uv sync --frozen
      - name: Verify contribution manifest and approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run atlas proposal check-approval "$GITHUB_EVENT_PATH"
